services:
  db:
    image: postgres:18
    env_file:
      - ./backend/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRESQL_USER}" -d "$${POSTGRESQL_DATABASE}"
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      JWT_SECRET_KEY_LOCATION: file:/app/secrets/jwt-secret.jwk
    volumes:
      - maven-cache:/root/.m2
      - ./backend/secrets/jwt-secret.jwk:/app/secrets/jwt-secret.jwk:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy


  frontend:
    build: ./frontend
    ports:
      - "2000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  maven-cache: